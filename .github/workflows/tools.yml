name: tools
on: pull_request
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run --help for every tool
        run: |
          python -m py_compile tools/*.py
          for t in tools/*.py; do python "$t" --help > /dev/null || { echo "::error file=$t::--help failed"; exit 1; }; done
