name: tools
on: pull_request
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run --help for every tool
        run: |
          python -m py_compile tools/*.py
          for t in tools/*.py; do python "$t" --help > /dev/null || { echo "::error file=$t::--help failed"; exit 1; }; done
      - name: Compile and run --help for the reference decoder
        run: |
          python -m py_compile decoder/*.py
          python decoder/orf_decode.py --help > /dev/null
      - name: Decoder round-trip tests (synthetic bytes)
        run: python tools/test_orf_decode.py
      - name: Conformance CLI tests
        run: python -I -B tools/test_conformance.py
      - name: value_map_probe tests
        run: |
          mkdir -p work/ci-tmp
          TMPDIR="$PWD/work/ci-tmp" python -I -B tools/test_value_map_probe.py
          TMPDIR="$PWD/work/ci-tmp" python -I -B tools/test_value_map_window_probe.py
      - name: orf_tokens tests
        run: python tools/test_orf_tokens.py
      - name: Token luma probe tests
        run: python -I -B tools/test_token_luma_probe.py
      - name: Token luma stride probe tests
        run: python -I -B tools/test_token_luma_stride_probe.py
      - name: Token phase and suffix joint tests
        run: |
          python -I -B tools/test_token_phase_probe.py
          python -I -B tools/suffix_joint_probe.py --self-test
      - name: Token count closure tests
        run: python -I -B tools/test_token_count_closure.py
      - name: orf signature tests
        run: python -I -B tools/test_orf_signature.py
      - name: Active area metadata tests
        run: python -I -B tools/test_orf_active_area.py
      - name: capture pair calibration tests
        run: python -I -B tools/test_capture_pair_calibration.py
      - name: Capture metadata audit tests
        run: python -I -B tools/test_capture_metadata_audit.py
      - name: Exif sensitivity probe tests
        run: python -I -B tools/test_exif_sensitivity_probe.py
      - name: preview pair screen tests
        run: python -I -B tools/test_preview_pair_screen.py
      - name: JPEG preview reader tests
        run: python -I -B tools/test_jpeg_dc.py
      - name: suffix_match_probe tests
        run: |
          python -I tools/test_suffix_match_probe.py
          python -I tools/suffix_match_probe.py --self-test
      - name: v0_spec_check tests
        run: |
          python -I tools/test_v0_spec_check.py
          python -I tools/v0_spec_check.py --self-test
      - name: PR safety scan tests
        run: python -I tools/test_pr_checks_safety.py
      - name: Issue and comment scan tests
        run: python -I tools/test_issue_scan.py
      - name: Finding partial scope tests
        run: python -I -B tools/test_findings_partial.py
      - name: Findings index identity tests
        run: python -I -B tools/test_findings_index.py
      - name: Offline automerge decision tests
        run: python -I -B tools/test_automerge_decision.py
      - name: Offline sample tool regression tests
        run: python -I -B tools/test_sample_tool_regressions.py
      - name: Offline manifest licence record tests
        run: python -I -B tools/test_manifest_offline.py
      - name: Metadata cohort design audit tests
        run: python -I -B tools/test_cohort_design_audit.py
      - name: Body label holdout tests
        run: python -I -B tools/test_body_label_holdout.py
      - name: Payload feature probe tests
        run: python -I -B tools/test_payload_feature_probe.py
      - name: Synthetic search calibration tests
        run: python -I -B tools/test_framing_search_calibration.py
      - name: Synthetic frozen model and coding controls
        run: |
          python -I -B tools/test_frozen_bit_context.py
          python -I -B tools/test_bounded_codec_controls.py
      - name: Synthetic framing and anchor synchronization tests
        run: |
          python -I -B tools/test_token_framing_probe.py
          python -I -B tools/test_token_anchor_sync_probe.py
      - name: Synthetic cyclic phase and holdout tests
        run: |
          python -I -B tools/test_token_cyclic_phase_probe.py
          python -I -B tools/test_token_phase_holdout_probe.py
      - name: Synthetic fixed-band and stride tests
        run: |
          python -I -B tools/test_token_band_profile.py
          python -I -B tools/test_token_row_stride.py
