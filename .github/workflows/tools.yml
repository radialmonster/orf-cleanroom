name: tools
on: pull_request
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run --help for every tool
        run: |
          python -m py_compile tools/*.py
          for t in tools/*.py; do python "$t" --help > /dev/null || { echo "::error file=$t::--help failed"; exit 1; }; done
      - name: Compile and run --help for the reference decoder
        run: |
          python -m py_compile decoder/*.py
          python decoder/orf_decode.py --help > /dev/null
      - name: Decoder round-trip tests (synthetic bytes)
        run: python tools/test_orf_decode.py
      - name: value_map_probe tests
        run: python tools/test_value_map_probe.py
      - name: orf_tokens tests
        run: python tools/test_orf_tokens.py
      - name: orf signature tests
        run: python -I -B tools/test_orf_signature.py
      - name: capture pair calibration tests
        run: python -I -B tools/test_capture_pair_calibration.py
      - name: preview pair screen tests
        run: python -I -B tools/test_preview_pair_screen.py
      - name: suffix_match_probe tests
        run: |
          python -I tools/test_suffix_match_probe.py
          python -I tools/suffix_match_probe.py --self-test
      - name: v0_spec_check tests
        run: |
          python -I tools/test_v0_spec_check.py
          python -I tools/v0_spec_check.py --self-test
      - name: PR safety scan tests
        run: python -I tools/test_pr_checks_safety.py
      - name: Issue and comment scan tests
        run: python -I tools/test_issue_scan.py
      - name: Offline automerge decision tests
        run: python -I -B tools/test_automerge_decision.py
      - name: Offline sample tool regression tests
        run: python -I -B tools/test_sample_tool_regressions.py
      - name: Offline manifest licence record tests
        run: python -I -B tools/test_manifest_offline.py
      - name: Metadata cohort design audit tests
        run: python -I -B tools/test_cohort_design_audit.py
      - name: Body label holdout tests
        run: python -I -B tools/test_body_label_holdout.py
      - name: Payload feature probe tests
        run: python -I -B tools/test_payload_feature_probe.py
