name: automerge
# Runs with a write token. It never checks out or runs PR code: it only calls
# the GitHub API and parses text (file contents are read as data via the API).
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  # Safety net: an hourly sweep picks up PRs whose run failed on a transient GitHub error.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}  # empty on schedule/dispatch: sweep all open PRs
    steps:
      - name: Merge verification and manifest PRs, flag the rest
        run: |
          python3 - <<'PY'
          import base64, csv, json, os, re, subprocess, sys, time

          # Plain characters only: the path goes into a bot comment on the lead.
          FINDING_RE = re.compile(r"^findings/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]md$")
          # `Partial:` text is quoted in a bot comment on the lead: no markup, links or mentions.
          # Quotes and # (issue refs) are fine; no [ ] < > ` @ (links, HTML, code, mentions).
          PARTIAL_RE = re.compile(r"^[A-Za-z0-9 ,.;:()+/_'\"#=%?!-]*$")
          # GitHub autolinks URLs and bare domains; `/` and `:` alone (paths, "V1: rows") stay allowed.
          LINKISH_RE = re.compile(r"://|\bwww[.]|\b[A-Za-z0-9-]+[.](?:com|org|net|io|dev|app|co|me|ly|xyz|info|gg|us|uk|de)\b",
                                  re.I)


          def gh(*args, **kw):
              # GitHub's API fails transiently now and then; retry before giving up.
              for wait in (5, 20, 60, 0):
                  r = subprocess.run(["gh"] + list(args), stdout=subprocess.PIPE, universal_newlines=True)
                  if r.returncode == 0 or not kw.get("retry", True):
                      break
                  if wait:
                      time.sleep(wait)
              if r.returncode != 0 and kw.get("check", True):
                  raise RuntimeError("gh %s failed" % " ".join(args[:3]))
              return r.stdout


          def header(text, key):
              """Value of a `Key: value` line in the part of the file before the first '## '."""
              head = text.replace("\r\n", "\n").split("\n## ", 1)[0]
              m = re.search(r"^%s:[ \t]*(.*?)[ \t]*$" % re.escape(key), head, re.M)
              return m.group(1) if m else ""


          def is_finding(f):
              return f["status"] == "added" and FINDING_RE.match(f["filename"]) and not f["filename"].endswith("/README.md")


          def decide(files, author, read_text, read_issue, total=None):
              """-> (reason, leads). reason "" means auto-mergeable; leads = [(issue number, finding path, kind, partial)],
              kind "self" (verifier is the finder), "independent" (a different person) or "upgrade"
              (a `Reproduces:` file by a different person, for a self-verified finding; the lead may be closed).

              read_text(file entry) -> decoded text of the file at the PR head (data only);
              read_issue(n) -> {"author": login, "labels": [...], "pr": bool} or None;
              total: the PR's changed_files count (the files list is capped at 3000 entries)."""
              leads = []
              if total is not None and (total != len(files) or total >= 3000):
                  return "its list of changed files could not be read in full", []
              if not files or any(not (is_finding(f) or (f["status"] == "modified" and f["filename"] == "samples/manifest.csv"))
                                  for f in files):
                  return "it changes more than new files under findings/ and rows added to samples/manifest.csv", []
              for f in files:
                  if not f["filename"].startswith("findings/"):
                      continue
                  path = f["filename"]
                  handle = os.path.basename(path).split("--")[1] if path.count("--") >= 2 else ""
                  try:
                      text = read_text(f)
                  except Exception:
                      return "a new findings file could not be read", []
                  fauthor = header(text, "Author").lstrip("@")
                  if header(text, "Verified by").lower() != "@" + author.lower():
                      return "a new findings file does not have 'Verified by: @%s' (the PR author)" % author, []
                  if not handle or handle.lower() != fauthor.lower():
                      return "a new findings file's Author and file name must name the same finder", []
                  selfv = handle.lower() == author.lower()
                  if selfv and header(text, "Reproduces"):
                      return "a self-verification cannot carry 'Reproduces:'", []
                  kind = "self" if selfv else ("upgrade" if header(text, "Reproduces") else "independent")
                  m = re.match(r"^#([0-9]+)$", header(text, "Lead"))
                  if not m:
                      return "a new findings file has no valid 'Lead: #<issue>' line", []
                  issue = read_issue(int(m.group(1)))
                  if (not issue or issue["pr"] or issue["author"].lower() != fauthor.lower()
                          or "lead" not in issue["labels"]):
                      return ("the lead issue #%s is missing, is not labelled lead, or was not opened by @%s"
                              % (m.group(1), fauthor)), []
                  partial = header(text, "Partial")
                  if not PARTIAL_RE.match(partial) or LINKISH_RE.search(re.sub(r"\braw[.]pixls[.]us\b", "", partial, flags=re.I)):
                      return ("the 'Partial:' line has characters other than letters, digits and simple punctuation, "
                              "or a link"), []
                  # `Partial: <which part>` verifies only part of a multi-claim lead; the lead stays open.
                  leads.append((int(m.group(1)), path, kind, header(text, "Partial")))
              for f in files:
                  if f["filename"] != "samples/manifest.csv":
                      continue
                  patch = f.get("patch") or ""
                  if not patch or any(l.startswith("-") for l in patch.split("\n")):
                      return "the manifest change is empty or removes lines", []
                  for line in patch.split("\n"):
                      if not line.startswith("+"):
                          continue
                      try:
                          last = next(csv.reader([line[1:]]), [""])[-1]
                      except csv.Error:
                          return "a new manifest row is not valid CSV", []
                      if not last.lower().startswith("@" + author.lower() + " "):
                          return "a new manifest row has a measured_by that does not start with @" + author, []
              return "", leads


          def main():
              repo, sha = os.environ["REPO"], os.environ.get("HEAD_SHA", "").strip()
              prs = json.loads(gh("pr", "list", "--repo", repo, "--state", "open", "--limit", "200",
                                  "--json", "number,headRefOid,author,labels"))
              if sha:
                  # workflow_run.pull_requests is empty for forks, so match on the head SHA.
                  pr = next((p for p in prs if p["headRefOid"] == sha), None)
                  if not pr:
                      print("No open PR with head " + sha)
                      return
                  return handle(repo, pr)
              # Sweep: open PRs not yet flagged whose required `check` passed on the current head.
              for pr in prs:
                  if "needs-maintainer" in [l["name"] for l in pr["labels"]]:
                      continue
                  runs = json.loads(gh("api", "repos/%s/commits/%s/check-runs?check_name=check&filter=latest"
                                       % (repo, pr["headRefOid"])))
                  # Only the Actions app's latest `check` run counts: an older success, or a run named
                  # `check` from another app, must not stand in for the current result.
                  ours = [c for c in runs.get("check_runs", []) if (c.get("app") or {}).get("slug") == "github-actions"]
                  latest = max(ours, key=lambda c: (c.get("started_at") or "", c.get("id") or 0), default=None)
                  if latest and latest.get("conclusion") == "success":
                      try:
                          handle(repo, pr)
                      except Exception as e:
                          print("PR #%s: %s" % (pr["number"], e))


          def merged(repo, num):
              return gh("pr", "view", num, "--repo", repo, "--json", "state", "--jq", ".state").strip() == "MERGED"


          def handle(repo, pr):
              num, author, sha = str(pr["number"]), pr["author"]["login"], pr["headRefOid"]
              # No bot comments on the owner's own PRs (they email the owner). Lead issues still get theirs.
              quiet = author.lower() == repo.split("/")[0].lower()
              files = [json.loads(l) for l in gh("api", "repos/%s/pulls/%s/files" % (repo, num), "--paginate",
                                                 "--jq", ".[]").splitlines() if l.strip()]

              def read_text(f):
                  url = f["contents_url"].replace("https://api.github.com/", "", 1)  # includes ?ref=<head sha>
                  data = json.loads(gh("api", url))
                  return base64.b64decode(data["content"]).decode("utf-8")

              def read_issue(n):
                  r = subprocess.run(["gh", "api", "repos/%s/issues/%d" % (repo, n)], stdout=subprocess.PIPE,
                                     universal_newlines=True)
                  if r.returncode != 0:
                      return None
                  d = json.loads(r.stdout)
                  return {"author": d["user"]["login"], "labels": [l["name"] for l in d["labels"]],
                          "pr": "pull_request" in d}

              total = int(gh("api", "repos/%s/pulls/%s" % (repo, num), "--jq", ".changed_files").strip())
              reason, leads = decide(files, author, read_text, read_issue, total)
              if not reason:
                  # A merge can fail transiently, or succeed and still report an error; confirm by state.
                  for wait in (5, 20, 60, 0):
                      gh("pr", "merge", num, "--repo", repo, "--squash", "--match-head-commit", sha,
                         check=False, retry=False)
                      if merged(repo, num):
                          break
                      time.sleep(wait)
                  if not merged(repo, num):
                      raise RuntimeError("merge of #%s failed; the hourly sweep will retry" % num)
                  if not quiet:
                      gh("pr", "comment", num, "--repo", repo, "--body",
                         "Merged automatically: verified findings/manifest only, checks passed. Thanks!")
                  for n, path, kind, partial in leads:
                      link = "https://github.com/%s/blob/main/%s" % (repo, path)
                      label = "self-verified" if kind == "self" else "verified"
                      gh("label", "create", "verified", "--repo", repo, "--force", "--color", "0e8a16",
                         "--description", "Reproduced by a different person; the finding is in findings/")
                      gh("label", "create", "self-verified", "--repo", repo, "--force", "--color", "fbca04",
                         "--description", "Reproduced by the finder; a different person can upgrade it (Reproduces:)")
                      if partial:
                          gh("label", "create", "partly-verified", "--repo", repo, "--force", "--color", "c2e0c6",
                             "--description", "Part of this lead is verified (see the finding); the rest is open")
                          label = "partly-verified"
                      gh("issue", "edit", str(n), "--repo", repo, "--add-label", label, check=False)
                      gh("issue", "edit", str(n), "--repo", repo, "--remove-label", "claimed", check=False)
                      for who in gh("issue", "view", str(n), "--repo", repo, "--json", "assignees",
                                    "--jq", ".assignees[].login", check=False).split():
                          gh("issue", "edit", str(n), "--repo", repo, "--remove-assignee", who, check=False)
                      if partial:
                          gh("issue", "comment", str(n), "--repo", repo, "--body",
                             "Partly verified by @%s%s in %s (part: %s). The rest of this lead stays open; "
                             "anyone can claim it." % (author, " (self-verified)" if kind == "self" else "", link,
                                                      partial if len(partial) <= 300 else partial[:300] + "... (see the finding)"),
                             check=False)
                          continue
                      gh("issue", "edit", str(n), "--repo", repo, "--remove-label", "partly-verified", check=False)
                      if kind == "upgrade":
                          gh("issue", "edit", str(n), "--repo", repo, "--remove-label", "self-verified", check=False)
                      gh("issue", "comment", str(n), "--repo", repo, "--body",
                         "Verified by @%s%s in %s" % (author, " (self-verified)" if kind == "self" else "", link),
                         check=False)
                      gh("issue", "close", str(n), "--repo", repo, check=False)  # no-op if already closed
                  return

              labels = gh("pr", "view", num, "--repo", repo, "--json", "labels", "--jq", ".labels[].name").split()
              print("PR #%s not auto-merged: %s" % (num, reason))
              if "needs-maintainer" in labels:
                  print("Already flagged: " + reason)
                  return
              gh("label", "create", "needs-maintainer", "--repo", repo, "--force", "--color", "d93f0b",
                 "--description", "Not auto-mergeable; waits for an occasional maintainer look")
              gh("pr", "edit", num, "--repo", repo, "--add-label", "needs-maintainer")
              if not quiet:
                  gh("pr", "comment", num, "--repo", repo, "--body",
                     "Checks passed, but this PR is not merged automatically because %s. Only a verification "
                     "(a new findings file you reproduced yourself, for an existing lead issue you or someone else opened) "
                     "and appended manifest rows from the PR author merge on their own (see CONTRIBUTING.md). "
                     "A maintainer will look occasionally; this can take weeks. Nothing is wrong with your work."
                     % reason)


          if __name__ == "__main__":
              main()
          PY
