name: findings-append-only
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: FINDINGS.md may only grow at the end
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git show "$base:FINDINGS.md" > /tmp/old.md 2>/dev/null || exit 0
          n=$(wc -c < /tmp/old.md)
          if ! head -c "$n" FINDINGS.md | cmp -s - /tmp/old.md; then
            echo "::error file=FINDINGS.md::Existing content in FINDINGS.md was changed or removed. Findings are append-only: add a new entry at the end instead (see RULES.md)."
            exit 1
          fi
      - name: New entries credit an author (warning for reviewers)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          n=$(git show "$base:FINDINGS.md" 2>/dev/null | wc -c)
          tail -c +"$((n + 1))" FINDINGS.md > /tmp/new.md
          grep -E '^## F[0-9]+ ' /tmp/new.md | while read -r line; do
            if ! echo "$line" | grep -qE '^## F[0-9]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}, @[A-Za-z0-9-]+\): '; then
              echo "::error file=FINDINGS.md::New entry heading doesn't match '## F<n> (YYYY-MM-DD, @author): title': $line"
              exit 1
            fi
            if ! echo "$line" | grep -q "@$PR_AUTHOR)"; then
              echo "::warning file=FINDINGS.md::Entry author differs from PR author @$PR_AUTHOR. Reviewer: check the entry has 'Submitted by: @$PR_AUTHOR' and the credited author agreed. $line"
            fi
          done
